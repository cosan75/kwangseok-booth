<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1d7f55">
<title>진로부스 동선</title>
<style>
@font-face{font-family:"Pretendard";src:url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/woff2/PretendardVariable.woff2") format("woff2-variations");font-weight:100 900;font-display:swap}
:root{
  --bg:#f4f7f5;--surface:#fdfdfe;--sunk:#e9efec;--line:#d8e2dc;--text:#14211b;--muted:#566a60;
  --c:#1d7f55;--c-t:#fdfdfe;--wait:#b85a14;--off:#7a8590;--now:#1f5fbf;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"D2Coding",monospace;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1311;--surface:#161d1a;--sunk:#1d2622;--line:#2a3631;--text:#eef4f1;--muted:#a3b3ab;
  --c:#6fd0a2;--c-t:#0e1311;--wait:#f0a868;--off:#8f9aa5;--now:#7fb0f2;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:clip}
body{background:var(--bg);color:var(--text);font:16px/1.5 "Pretendard",system-ui,"Malgun Gothic",sans-serif;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
button,input{font:inherit;color:inherit}
:where(a,button,input,[tabindex]):focus-visible{outline:2px solid var(--c);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
header{background:var(--c);color:var(--c-t);padding:14px 16px 12px}
header h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.4px}
header p{margin:2px 0 0;font-size:13.5px;opacity:.9}
.seg{display:flex;gap:4px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.seg button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 6px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--c-t)}
main{max-width:760px;margin:0 auto;padding:14px 16px 40px}
.nowline{background:color-mix(in srgb,var(--now) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--now) 35%,var(--line));border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:15px}
.nowline b{color:var(--now)}
h2{font-size:15px;color:var(--muted);margin:18px 0 8px;font-weight:700}
.groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.g{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 8px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:86px}
.g b{font-size:26px;line-height:1.1;font-weight:800;color:var(--c)}
.g span{font-size:14px;font-weight:600}
.g small{font-size:12px;color:var(--muted)}
.g[aria-pressed="true"]{background:var(--c);border-color:var(--c)}
.g[aria-pressed="true"] *{color:var(--c-t)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:14px}
.card h3{margin:0 0 2px;font-size:20px;font-weight:800;letter-spacing:-.3px}
.card .sub{color:var(--muted);font-size:14px;margin-bottom:10px}
.route{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.route li{display:grid;grid-template-columns:2.2em 6.6em 1fr;gap:8px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.route li:last-child{border-bottom:0}
.route .no{font-family:var(--mono);color:var(--muted);text-align:center}
.route .tm{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.route .what{font-weight:700;font-size:16px}
.route .what small{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.route li.wait .what{color:var(--wait)}
.route li.off .what{color:var(--off);font-weight:500}
.route li.now{background:color-mix(in srgb,var(--now) 12%,transparent);border-radius:10px;box-shadow:0 0 0 2px var(--now) inset}
.route li.now .no::after{content:"지금";display:block;font-size:10px;color:var(--now);font-weight:700}
.route li.past{opacity:.5}
.bnum{display:inline-grid;place-items:center;min-width:1.9em;height:1.9em;border-radius:8px;background:var(--c);color:var(--c-t);font-family:var(--mono);font-size:14px;margin-right:6px;vertical-align:1px}
.booths{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.b{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:left;cursor:pointer;display:flex;gap:8px;align-items:center}
.b[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 2px var(--c) inset}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}
.empty{color:var(--muted)}
/* QR */
.qrwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.qr{background:#fff;padding:10px;border-radius:10px;line-height:0;border:1px solid var(--line)}
.qr img{width:180px;height:180px;image-rendering:pixelated}
.qrwrap input{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-family:var(--mono);font-size:13px;background:var(--surface)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;text-decoration:none;color:inherit}
.btn.primary{background:var(--c);border-color:var(--c);color:var(--c-t)}
.sheet{display:none}
@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff;color:#000}
  header,.seg,main>*:not(.sheet){display:none!important}
  main{max-width:none;padding:0}
  .sheet{display:grid!important;grid-template-columns:repeat(3,1fr);gap:6mm}
  .tile{border:1px solid #999;border-radius:4mm;padding:4mm;text-align:center;break-inside:avoid}
  .tile b{font-size:28pt;display:block;line-height:1}
  .tile span{font-size:12pt}
  .tile img{width:38mm;height:38mm;image-rendering:pixelated;margin-top:2mm}
  .tile small{display:block;font-size:8pt;color:#444}
}
@media (min-width:640px){.groups{grid-template-columns:repeat(5,minmax(0,1fr))}.booths{grid-template-columns:repeat(5,minmax(0,1fr))}}
</style>
</head>

<script src="vendor/qrcode.min.js"></script>
<script>
"use strict";
/* 진로부스 동선: ../online-office/data/sources.json·snapshot.json 공유.
   쓰는 탭: 부스 프로그램 · 운영 시간표 · 그룹별 동선표 · 체험 현황 요약(담당교사, 이름은 원본에서 이미 가려짐). 학생 명단 탭은 읽지 않는다. */
const OO="../online-office/";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clean=s=>String(s??"").replace(/\r/g,"").trim();
const NET=window.top===window.self;
async function fetchText(url,ms=10000){if(!NET)throw new Error("preview");const ac=new AbortController();const t=setTimeout(()=>ac.abort(),ms);
  try{const r=await fetch(url,{signal:ac.signal,credentials:"omit"});if(!r.ok)throw new Error(r.status);return await r.text()}finally{clearTimeout(t)}}
function parseCSV(text){const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===","){row.push(f);f=""}else if(c==="\n"){row.push(f);rows.push(row);row=[];f=""}else if(c!=="\r")f+=c}
  if(f||row.length){row.push(f);rows.push(row)}return rows.map(r=>r.map(clean))}

let PUB_AT=null,SRC,CFG,D={booths:[],route:null,tt:null,groups:[],notes:[]},live=false;
async function load(){
  if(window.BOOTH_DATA){const B=window.BOOTH_DATA;CFG=B.cfg;SRC={sheets:[],_snap:{sheets:B.sheets}};
    ["booth-prog","booth-route","booth-sum","booth-tt"].forEach(k=>SRC.sheets.push({key:k}));PUB_AT=B.builtAt}
  if(!SRC){const [s,snap]=await Promise.all([fetch(OO+"data/sources.json").then(r=>r.json()),fetch(OO+"data/snapshot.json").then(r=>r.json()).catch(()=>null)]);SRC=s;SRC._snap=snap;CFG=s.booth||{}}
  const sh=k=>SRC.sheets.find(x=>x.key===k);
  const get=async k=>{const s=sh(k);if(!s)return"";if(window.BOOTH_DATA)return SRC._snap.sheets[k]||"";try{const t=await fetchText(`https://docs.google.com/spreadsheets/d/${s.file}/export?format=csv&gid=${s.gid}`);live=true;return t}catch{return SRC._snap?.sheets?.[k]||""}};
  const [prog,route,sum,tt]=await Promise.all(["booth-prog","booth-route","booth-sum","booth-tt"].map(get));
  // 부스 프로그램: 번호·이름·비고(장소 협의 등)
  const P=parseCSV(prog);
  D.booths=P.filter(r=>/^\d+$/.test(r[0])&&r[1]).map(r=>({no:+r[0],name:r[1],memo:r[2]||""}));
  D.notes=[...P,...parseCSV(route)].map(r=>r.find(c=>c.startsWith("※"))).filter(Boolean);
  // 그룹별 동선표: 차시×그룹
  const R=parseCSV(route),rh=R.findIndex(r=>r[0]==="차시");
  D.route=rh<0?null:{hdr:R[rh],rows:R.slice(rh+1).filter(r=>/^\d+$/.test(r[0]))};
  // 운영 시간표: 차시×부스
  const T=parseCSV(tt),th=T.findIndex(r=>r[0]==="차시");
  D.tt=th<0?null:{hdr:T[th],rows:T.slice(th+1).filter(r=>/^\d+$/.test(r[0]))};
  // 체험 현황 요약: 그룹·담당교사·학년·인원
  const S=parseCSV(sum),info={};
  for(const r of S){const m=(r[1]||"").match(/^([A-Z])그룹$/);if(m)info[m[1]]={level:r[0],n:r[2],teacher:r[3],grade:r[4],times:r[5]}}
  const letters=D.route?D.route.hdr.slice(2).map(h=>(h.match(/^([A-Z])그룹$/)||[])[1]).filter(Boolean):Object.keys(info);
  D.groups=letters.map(L=>({L,...(info[L]||{})}));
  render();
}

/* 시각 */
const hm=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};
const isEventDay=()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");return CFG.date===`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`};
function slotState(range){ // "09:20~09:35"
  if(!isEventDay())return"";const [a,b]=range.split("~").map(x=>hm(x.trim()));const n=new Date(),t=n.getHours()*60+n.getMinutes();
  return t>=b?"past":t>=a?"now":""}
function nowLine(){
  if(!D.route)return"";const ev=CFG.date?new Date(CFG.date+"T00:00:00"):null;
  if(!isEventDay())return ev?`<div class="nowline">행사일 <b>${ev.getMonth()+1}월 ${ev.getDate()}일(${"일월화수목금토"[ev.getDay()]})</b> · ${esc(D.route.rows[0]?.[1]?.split("~")[0]||"")} 시작. 당일에는 지금 차시가 자동으로 표시됩니다.</div>`:"";
  const cur=D.route.rows.find(r=>slotState(r[1])==="now");
  return`<div class="nowline">${cur?`지금 <b>${cur[0]}차시</b> <span class="num">${esc(cur[1])}</span>`:"지금은 체험 시간이 아닙니다"}</div>`;
}
function describe(cell){ // 동선표 칸 → {kind, html}
  const m=cell.match(/^부스\s*(\d+)$/);
  if(m){const b=D.booths.find(x=>x.no===+m[1]);return{kind:"booth",html:`<span class="bnum">${m[1]}</span>${esc(b?.name||"")}${b?.memo?`<small>${esc(b.memo)}</small>`:""}`}}
  const w=cell.match(/^대기\/(.+)$/);
  if(w){const where=(CFG.waits||{})[w[1]]||w[1];return{kind:"wait",html:w[1]==="이동"?"이동":`대기 · ${esc(where)}`}}
  return{kind:"off",html:esc(cell||"-")};
}

/* 화면 */
let mode="group",sel=null,selBooth=null;
function groupBtns(){
  return`<div class="groups" role="group" aria-label="그룹 선택">${D.groups.map(g=>`<button type="button" class="g" data-g="${g.L}" aria-pressed="${sel===g.L}">
    <b>${g.L}</b><span>${esc(g.teacher||(g.level==="중등"?"중등":"담당 미정"))}</span><small>${esc(g.grade||"")}</small></button>`).join("")}</div>`;
}
function routeCard(L){
  if(!D.route)return`<p class="empty">동선표를 읽지 못했습니다.</p>`;
  const i=D.route.hdr.findIndex(h=>h===L+"그룹");if(i<0)return"";
  const g=D.groups.find(x=>x.L===L)||{};
  const booths=D.route.rows.map(r=>r[i]).filter(c=>/^부스/.test(c)).length;
  return`<section class="card" aria-live="polite"><h3>${L}그룹${g.teacher?` · ${esc(g.teacher)} 선생님`:""}</h3>
    <div class="sub">${esc(g.grade||"")}${g.n?` · ${esc(g.n)}명`:""} · 부스 ${booths}곳 체험</div>
    <ol class="route">${D.route.rows.map(r=>{const d=describe(r[i]),st=slotState(r[1]);
      return`<li class="${d.kind}${st?" "+st:""}"><span class="no">${esc(r[0])}</span><span class="tm">${esc(r[1])}</span><span class="what">${d.html}</span></li>`}).join("")}</ol>
    ${D.notes.map(n=>`<p class="note">${esc(n)}</p>`).join("")}</section>`;
}
function boothView(){
  if(!D.tt)return`<p class="empty">운영 시간표를 읽지 못했습니다.</p>`;
  const col=selBooth?D.tt.hdr.findIndex(h=>h.replace(/\s/g,"")===`부스${selBooth}`):-1;
  return`<h2>부스를 고르면 차시마다 오는 그룹이 나옵니다 (부스 담당 선생님용)</h2>
    <div class="booths" role="group" aria-label="부스 선택">${D.booths.map(b=>`<button type="button" class="b" data-b="${b.no}" aria-pressed="${selBooth===b.no}"><span class="bnum">${b.no}</span><span>${esc(b.name)}</span></button>`).join("")}</div>
    ${col>0?`<section class="card"><h3>부스 ${selBooth} · ${esc(D.booths.find(b=>b.no===selBooth)?.name||"")}</h3><div class="sub">차시별로 오는 그룹</div>
      <ol class="route">${D.tt.rows.map(r=>{const v=r[col]||"",L=(v.match(/^([A-Z])그룹$/)||[])[1],g=D.groups.find(x=>x.L===L),st=slotState(r[1]);
        return`<li class="${L?"booth":"off"}${st?" "+st:""}"><span class="no">${esc(r[0])}</span><span class="tm">${esc(r[1])}</span><span class="what">${L?`${L}그룹${g?.teacher?` <small>${esc(g.teacher)} · ${esc(g.grade||"")}</small>`:g?.grade?` <small>${esc(g.grade)}</small>`:""}`:esc(v||"-")}</span></li>`}).join("")}</ol></section>`:""}`;
}
// QR: 이 PC가 localhost로 열려 있으면 휴대폰이 그 주소로는 못 들어오므로 sources.json booth.lanUrl(학내망 IP) 사용
function baseURL(){
  try{const saved=localStorage.getItem("booth.base");if(saved)return saved}catch{}
  if(window.BOOTH_DATA)return location.origin+location.pathname.replace(/index\.html$/,"");
  if(CFG.publicUrl)return CFG.publicUrl; // 공개 배포가 있으면 학교 밖(LTE)에서도 열리는 주소가 기본
  const loc=location.origin+location.pathname.replace(/index\.html$/,"");
  return /localhost|127\.0\.0\.1|\[::1\]/.test(location.hostname)||location.protocol==="file:"?(CFG.lanUrl||loc):loc;
}
function qrImg(text,cell=6){const q=qrcode(0,"M");q.addData(text);q.make();return q.createDataURL(cell,2)}
function qrView(){
  const base=baseURL();
  return`<section class="card"><h3>휴대폰으로 보기</h3><div class="sub">학교 Wi-Fi에 연결된 휴대폰 카메라로 찍으세요.</div>
    <div class="qrwrap"><div class="qr"><img alt="전체 동선 QR: ${esc(base)}" src="${qrImg(base)}"></div>
      <div style="flex:1;min-width:220px"><label class="note" for="baseIn">QR 주소</label><input id="baseIn" value="${esc(base)}">
        ${!window.BOOTH_DATA&&CFG.publicUrl&&CFG.lanUrl?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"><button class="btn" type="button" data-base="${esc(CFG.publicUrl)}">인터넷 주소 (어디서나)</button><button class="btn" type="button" data-base="${esc(CFG.lanUrl)}">학내망 주소 (실시간)</button></div>
        <p class="note">인터넷 주소는 배포할 때의 자료를 보여 줍니다(학생 명단이 있는 원본 시트에는 연결하지 않음). 학내망 주소는 원본 시트를 바로 읽지만 학교 Wi-Fi에서만 열립니다.</p>`:""}
        <p class="note" ${window.BOOTH_DATA||base===CFG.publicUrl?'hidden':''}>휴대폰에서 안 열리면: ① 휴대폰이 학교 Wi-Fi인지 ② 이 PC에서 포털 서버(실행하기.bat)가 켜져 있는지 ③ PC의 IP가 바뀌지 않았는지(명령 프롬프트 <span class="num">ipconfig</span>) 확인하세요. Windows 방화벽이 8899 포트를 막으면 처음 한 번 '허용'이 필요합니다.</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn primary" type="button" id="printBtn">그룹별 QR 인쇄 (A4)</button><button class="btn" type="button" id="resetBase">주소 기본값</button></div></div></div></section>
    <section class="card"><h3>그룹별 QR</h3><div class="sub">찍으면 그 그룹 동선이 바로 열립니다. 인쇄해서 담당 선생님께 나눠 주세요.</div>
      <div class="groups">${D.groups.map(g=>`<div class="g" style="cursor:default"><b>${g.L}</b><span>${esc(g.teacher||g.level||"")}</span><div class="qr" style="padding:4px"><img style="width:96px;height:96px" alt="${g.L}그룹 동선 QR" src="${qrImg(base+"?g="+g.L,4)}"></div></div>`).join("")}</div></section>
    <div class="sheet">${D.groups.map(g=>`<div class="tile"><b>${g.L}</b><span>${esc(g.teacher?g.teacher+" 선생님":g.level||"")} · ${esc(g.grade||"")}</span><img alt="" src="${qrImg(base+"?g="+g.L,6)}"><small>${esc(CFG.title||"진로융합부스체험")} 동선 · ${esc(base)}?g=${g.L}</small></div>`).join("")}</div>`;
}
function render(){
  $("#title").textContent=CFG.title||"진로융합부스체험";
  const m=$("#main");
  if(mode==="group")m.innerHTML=nowLine()+`<h2>그룹을 누르세요 (담당 선생님)</h2>`+groupBtns()+(sel?routeCard(sel):"")+`<p class="note">${PUB_AT?`${esc(PUB_AT)} 기준 자료입니다. 바뀐 내용은 교무실에 확인하세요.`:live?"원본 시트에서 방금 읽었습니다.":"저장본을 보여 주고 있습니다."}</p>`;
  else if(mode==="booth")m.innerHTML=nowLine()+boothView();
  else m.innerHTML=qrView();
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.mode===mode)));
}
document.addEventListener("click",e=>{
  const s=e.target.closest(".seg button");if(s){mode=s.dataset.mode;render();return}
  const g=e.target.closest("[data-g]");if(g){sel=sel===g.dataset.g?null:g.dataset.g;history.replaceState(null,"",sel?"?g="+sel:location.pathname);render();
    if(sel)document.querySelector(".card")?.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});return}
  const b=e.target.closest("[data-b]");if(b){selBooth=+b.dataset.b;render();return}
  if(e.target.id==="printBtn")window.print();
  const bb=e.target.closest("[data-base]");if(bb){try{localStorage.setItem("booth.base",bb.dataset.base)}catch{}render();return}
  if(e.target.id==="resetBase"){try{localStorage.removeItem("booth.base")}catch{}render()}
});
document.addEventListener("change",e=>{if(e.target.id==="baseIn"){let v=e.target.value.trim();if(v&&!v.endsWith("/")&&!/\.html$/.test(v))v+="/";try{localStorage.setItem("booth.base",v)}catch{}render()}});

const q=new URLSearchParams(location.search);sel=(q.get("g")||"").toUpperCase()||null;if(q.get("view")==="booth")mode="booth";
load().catch(e=>{$("#main").innerHTML=`<p class="empty">불러오지 못했습니다: ${esc(e.message)}</p>`});
setInterval(()=>{if(mode!=="qr")render()},30e3);       // 지금 차시 표시
setInterval(()=>{load().catch(()=>{})},5*60e3);        // 원본 다시 읽기
</script>
</body>
</html>
